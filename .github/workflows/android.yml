name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto GTA SA
        uses: actions/checkout@v4
        with:
          repository: gta-android/gta-reversed-android
          path: gta

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          cd gta/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-APK
          path: gta/android/app/build/outputs/apk/debug/*.apk
